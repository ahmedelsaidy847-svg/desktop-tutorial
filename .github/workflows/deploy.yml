name: Deploy ERP to GitHub Pages

on:
  push:
    branches: [main, claude/complete-sheet-clients-j4PNP]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: erp-system/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: erp-system

      - name: Build
        run: npm run build
        working-directory: erp-system

      - uses: actions/upload-pages-artifact@v3
        with:
          path: erp-system/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - id: deployment
        uses: actions/deploy-pages@v4
