version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: erp_rmc
      POSTGRES_USER: erp_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-SecurePass123}
    ports:
      - '5432:5432'
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./shared/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U erp_user -d erp_rmc']
      interval: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    command: redis-server --requirepass ${REDIS_PASSWORD:-RedisPass123}
    volumes:
      - redis_data:/data

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - '5672:5672'
      - '15672:15672'
    environment:
      RABBITMQ_DEFAULT_USER: erp
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASSWORD:-RabbitPass123}
    volumes:
      - rabbit_data:/var/lib/rabbitmq

  fi-core:
    build:
      context: ./services/fi-core
      dockerfile: Dockerfile
    ports:
      - '3001:3001'
    environment:
      DATABASE_URL: postgresql://erp_user:${DB_PASSWORD:-SecurePass123}@postgres:5432/erp_rmc
      REDIS_URL: redis://:${REDIS_PASSWORD:-RedisPass123}@redis:6379
      RABBITMQ_URL: amqp://erp:${RABBIT_PASSWORD:-RabbitPass123}@rabbitmq:5672
      PORT: 3001
    depends_on:
      postgres:
        condition: service_healthy

  hcm-service:
    build:
      context: ./services/hcm-service
      dockerfile: Dockerfile
    ports:
      - '3002:3002'
    environment:
      DATABASE_URL: postgresql://erp_user:${DB_PASSWORD:-SecurePass123}@postgres:5432/erp_rmc
      RABBITMQ_URL: amqp://erp:${RABBIT_PASSWORD:-RabbitPass123}@rabbitmq:5672
      PORT: 3002
    depends_on:
      postgres:
        condition: service_healthy

  payroll-service:
    build:
      context: ./services/payroll-service
      dockerfile: Dockerfile
    ports:
      - '3003:3003'
    environment:
      DATABASE_URL: postgresql://erp_user:${DB_PASSWORD:-SecurePass123}@postgres:5432/erp_rmc
      FI_CORE_URL: http://fi-core:3001
      RABBITMQ_URL: amqp://erp:${RABBIT_PASSWORD:-RabbitPass123}@rabbitmq:5672
      PORT: 3003
    depends_on:
      - fi-core
      - postgres

  rmc-operations:
    build:
      context: ./services/rmc-operations
      dockerfile: Dockerfile
    ports:
      - '3004:3004'
    environment:
      DATABASE_URL: postgresql://erp_user:${DB_PASSWORD:-SecurePass123}@postgres:5432/erp_rmc
      FI_CORE_URL: http://fi-core:3001
      RABBITMQ_URL: amqp://erp:${RABBIT_PASSWORD:-RabbitPass123}@rabbitmq:5672
      PORT: 3004
    depends_on:
      - fi-core
      - postgres

  api-gateway:
    image: nginx:alpine
    ports:
      - '3000:80'
    volumes:
      - ./api-gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - fi-core
      - hcm-service
      - payroll-service
      - rmc-operations

volumes:
  pg_data:
  redis_data:
  rabbit_data:
